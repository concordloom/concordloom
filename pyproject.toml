[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordloom"
version = "0.1.4"
description = "A universal grammar for evidence-governed systems of development loops"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Concord Loom contributors"}]
keywords = ["development-loops", "governance", "evidence", "provenance", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://concordloom.github.io/concordloom/"
Repository = "https://github.com/concordloom/concordloom"
Issues = "https://github.com/concordloom/concordloom/issues"

[project.scripts]
concordloom = "concordloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/concordloom/schemas" = ["schemas/*.json"]
"share/concordloom/framework/generic-sdlc" = ["framework/generic-sdlc/*.json"]
