name: Documentation issue
description: Report unclear, incorrect, missing, or mismatched documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: https://… or docs/QUICKSTART.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Quote only the smallest relevant fragment and explain the practical consequence.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Optional wording, example, or source that would resolve the issue.
  - type: dropdown
    id: languages
    attributes:
      label: Affected language versions
      options:
        - English and Russian
        - English only
        - Russian only
        - Not sure
    validations:
      required: true
