name: Frontend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright, accessibility and responsive contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Check out the pinned candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend verification
        run: npm run test:frontend

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: frontend-evidence-${{ github.run_attempt }}
          path: |
            .artifacts/playwright/report
            .artifacts/playwright/results
          if-no-files-found: error
          retention-days: 14
